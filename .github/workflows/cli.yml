name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: always()
        run: npm audit --omit=dev --audit-level=high

  central-fixture:
    name: Central fixture (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build and run fixture contract tests
        run: >-
          docker build
          --platform=linux/amd64
          --target=test
          --tag=a2a-central-fixture-test
          test/fixtures/central
      - name: Build runtime fixture
        run: >-
          docker build
          --platform=linux/amd64
          --target=runtime
          --tag=a2a-central-fixture
          test/fixtures/central
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:build
      - name: Run gateway against FastMCP
        shell: bash
        run: |
          set -euo pipefail
          container=a2a-central-fixture-e2e
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run \
            --detach \
            --name "$container" \
            --network=host \
            a2a-central-fixture >/dev/null

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null
          A2A_FASTMCP_FIXTURE_URL=http://127.0.0.1:8000 \
            node --test .test-dist/test/fastmcp-e2e.test.js
      - name: Verify hardened runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          container=a2a-central-fixture-ci
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run \
            --detach \
            --name "$container" \
            --network=none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            a2a-central-fixture >/dev/null

          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$container")" = exited ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker inspect --format '{{.Config.User}}' a2a-central-fixture)" = fixture

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, central-fixture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use qualified npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Check published version
        id: version
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish
