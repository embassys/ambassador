name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "1440"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE_STRICT: "true"
  PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: "true"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - name: Enable qualified pnpm
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Validate classified CX02 Codex App Server adapter inventory
        run: node scripts/run-red-inventory.mjs --suite=cx02
      - name: Validate classified CL02 Claude Code adapter inventory
        run: node scripts/run-red-inventory.mjs --suite=cl02
      - if: always()
        run: pnpm audit --prod --audit-level=high
      - if: always()
        run: pnpm audit signatures

  central-fixture:
    name: Central fixture (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build and run fixture contract tests
        run: >-
          docker build
          --platform=linux/amd64
          --target=test
          --tag=a2a-central-fixture-test
          test/fixtures/central
      - name: Build runtime fixture
        run: >-
          docker build
          --platform=linux/amd64
          --target=runtime
          --tag=a2a-central-fixture
          test/fixtures/central
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - name: Enable qualified pnpm
        run: |
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:build
      - name: Pack and install gateway for Docker E2E
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/a2adev-gateway-docker-$(node -p "require('./package.json').version").tgz"
          pnpm pack --out "$tarball"
          install_root="$RUNNER_TEMP/a2a-docker-install"
          mkdir -p "$install_root"
          pnpm \
            --dir "$install_root" \
            --allow-build=better-sqlite3 \
            add "$tarball"
          test -x "$install_root/node_modules/.bin/a2a-gateway"
      - name: Run packaged gateway against current REST fixture
        shell: bash
        run: |
          set -euo pipefail
          container=a2a-central-fixture-e2e
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run \
            --detach \
            --name "$container" \
            --network=host \
            a2a-central-fixture >/dev/null

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null
          A2A_PACKED_GATEWAY_CLI="$RUNNER_TEMP/a2a-docker-install/node_modules/@a2adev/gateway/dist/cli.js" \
            A2A_CENTRAL_REST_FIXTURE_URL=http://127.0.0.1:8000 \
            node --test .test-dist/test/current-rest-docker-e2e.test.js
      - name: Verify hardened runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          container=a2a-central-fixture-ci
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run \
            --detach \
            --name "$container" \
            --network=none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            a2a-central-fixture >/dev/null

          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$container")" = exited ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          test "$(docker inspect --format '{{.Config.User}}' a2a-central-fixture)" = fixture

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - name: Enable qualified pnpm
        run: |
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:build
      - name: Pack and install release artifact
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/a2adev-gateway-$(node -p "require('./package.json').version").tgz"
          pnpm pack --out "$tarball"
          install_root="$RUNNER_TEMP/a2a-install"
          mkdir -p "$install_root"
          pnpm \
            --dir "$install_root" \
            --allow-build=better-sqlite3 \
            add "$tarball"
          pnpm --dir "$install_root" audit --prod --audit-level=high
          set +e
          signature_report=$(pnpm --dir "$install_root" audit signatures --json)
          signature_status=$?
          set -e
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          SIGNATURE_STATUS="$signature_status" \
          SIGNATURE_REPORT="$signature_report" \
          PACKAGE_NAME="$package_name" \
          PACKAGE_VERSION="$package_version" \
            node --input-type=module -e '
              const report = JSON.parse(process.env.SIGNATURE_REPORT);
              const status = Number(process.env.SIGNATURE_STATUS);
              const name = process.env.PACKAGE_NAME;
              const version = process.env.PACKAGE_VERSION;
              const clean = Array.isArray(report.missing) && report.missing.length === 0;
              const allVerified = status === 0 && clean && report.invalid?.length === 0 && report.audited === report.verified;
              const localOnly = status === 1 && clean && report.invalid?.length === 1 && report.audited === report.verified + 1 && report.invalid[0]?.name === name && report.invalid[0]?.version === version && report.invalid[0]?.registry === "https://registry.npmjs.org/" && report.invalid[0]?.reason === `Missing registry metadata for ${name}@${version}`;
              if (!allVerified && !localOnly) process.exit(1);
            '
          test -x "$install_root/node_modules/.bin/a2a-gateway"
          A2A_PACKED_GATEWAY_CLI="$install_root/node_modules/@a2adev/gateway/dist/cli.js" \
            node --test .test-dist/test/current-packed-e2e.test.js
          A2A_PACKED_HERMES_BRIDGE="$install_root/node_modules/@a2adev/gateway/docs/hermes-webhook-bridge.mjs" \
            node --test .test-dist/test/hermes-webhook-bridge.test.js

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, central-fixture, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable qualified pnpm
        run: |
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = 11.22.0
      - run: pnpm install --frozen-lockfile
      - name: Check published version
        id: version
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if pnpm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack and test publication artifact
        if: steps.version.outputs.publish == 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:build
          tarball="$RUNNER_TEMP/a2adev-gateway-$(node -p "require('./package.json').version").tgz"
          pnpm pack --out "$tarball"
          install_root="$RUNNER_TEMP/a2a-publish-install"
          mkdir -p "$install_root"
          pnpm \
            --dir "$install_root" \
            --allow-build=better-sqlite3 \
            add "$tarball"
          pnpm --dir "$install_root" audit --prod --audit-level=high
          set +e
          signature_report=$(pnpm --dir "$install_root" audit signatures --json)
          signature_status=$?
          set -e
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          SIGNATURE_STATUS="$signature_status" \
          SIGNATURE_REPORT="$signature_report" \
          PACKAGE_NAME="$package_name" \
          PACKAGE_VERSION="$package_version" \
            node --input-type=module -e '
              const report = JSON.parse(process.env.SIGNATURE_REPORT);
              const status = Number(process.env.SIGNATURE_STATUS);
              const name = process.env.PACKAGE_NAME;
              const version = process.env.PACKAGE_VERSION;
              const clean = Array.isArray(report.missing) && report.missing.length === 0;
              const allVerified = status === 0 && clean && report.invalid?.length === 0 && report.audited === report.verified;
              const localOnly = status === 1 && clean && report.invalid?.length === 1 && report.audited === report.verified + 1 && report.invalid[0]?.name === name && report.invalid[0]?.version === version && report.invalid[0]?.registry === "https://registry.npmjs.org/" && report.invalid[0]?.reason === `Missing registry metadata for ${name}@${version}`;
              if (!allVerified && !localOnly) process.exit(1);
            '
          test -x "$install_root/node_modules/.bin/a2a-gateway"
          A2A_PACKED_GATEWAY_CLI="$install_root/node_modules/@a2adev/gateway/dist/cli.js" \
            node --test .test-dist/test/current-packed-e2e.test.js
          A2A_PACKED_HERMES_BRIDGE="$install_root/node_modules/@a2adev/gateway/docs/hermes-webhook-bridge.mjs" \
            node --test .test-dist/test/hermes-webhook-bridge.test.js
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Use OIDC-capable npm publisher
        if: steps.version.outputs.publish == 'true'
        run: npm install --global npm@11.19.0
      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish "${{ steps.artifact.outputs.tarball }}"
