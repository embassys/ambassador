name: Desktop development

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Unsigned desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
      - name: Enable qualified pnpm
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
          test "$(pnpm --version)" = 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @embassys/desktop run typecheck
      - run: pnpm --filter @embassys/desktop run test:artifacts
      - run: pnpm run test:build
      - run: node desktop/scripts/verify-tests.mjs
      - run: pnpm --filter @embassys/desktop run build
      - run: pnpm --filter @embassys/desktop run verify
      - run: pnpm --filter @embassys/desktop run package
      - run: pnpm --filter @embassys/desktop run verify:portable
      - run: pnpm --filter @embassys/desktop run distribute
      - run: pnpm --filter @embassys/desktop run verify:distribution
      - name: Verify packaged host startup and shutdown
        if: runner.os != 'Linux'
        run: pnpm --filter @embassys/desktop run verify:package ${{ runner.os == 'macOS' && '--measure-memory' || '' }}
      - name: Verify packaged host under a Linux test display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_helper="$GITHUB_WORKSPACE/.build/desktop/packages/Embassys-linux-x64/chrome-sandbox"
          test -f "$sandbox_helper" && test ! -L "$sandbox_helper"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
          xvfb-run -a pnpm --filter @embassys/desktop run verify:package
      - name: Verify CLI and app handoffs
        if: runner.os != 'Linux'
        run: pnpm --filter @embassys/desktop run verify:shared
      - name: Verify CLI and app handoffs under a Linux test display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @embassys/desktop run verify:shared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            .build/desktop/app/build-manifest.json
            .build/desktop/host-resource-qualification.json
            .build/desktop/shared-host-qualification.json
            .build/desktop/distribution/*.manifest.json
            .build/desktop/distribution/*.cdx.json
            .build/desktop/distribution/*.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-downloads-${{ matrix.os }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            .build/desktop/distribution/*.dmg
            .build/desktop/distribution/*.zip
            .build/desktop/distribution/*.tar.gz
            .build/desktop/distribution/*.manifest.json
            .build/desktop/distribution/*.cdx.json
            .build/desktop/distribution/*.sha256

# Verified downloads are retained for an explicitly authorized GitHub prerelease.
# This read-only workflow does not publish or qualify native provider behavior.
